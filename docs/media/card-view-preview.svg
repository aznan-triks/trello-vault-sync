<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #1e1e24; }
      .sidebar-bg { fill: #18181c; }
      .panel-bg { fill: #23232a; }
      .card-bg { fill: #2a2a34; }
      .border { stroke: #383844; stroke-width: 1; }
      .text-title { fill: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 15px; }
      .text-body { fill: #cbd5e1; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; }
      .text-muted { fill: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; }
      .accent { fill: #7c3aed; }
      .badge-purple { fill: #6d28d9; }
      .badge-green { fill: #059669; }
      .badge-text { fill: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 500; }
      .checkbox { fill: #1e293b; stroke: #64748b; stroke-width: 1.5; rx: 3; }
      .checkbox-checked { fill: #7c3aed; stroke: #7c3aed; stroke-width: 1.5; rx: 3; }
      .check-mark { stroke: #ffffff; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- App Window Background -->
  <rect width="920" height="480" rx="8" class="bg" />

  <!-- Window Header / Titlebar -->
  <rect width="920" height="38" rx="8" fill="#141418" />
  <circle cx="20" cy="19" r="6" fill="#ef4444" />
  <circle cx="38" cy="19" r="6" fill="#f59e0b" />
  <circle cx="56" cy="19" r="6" fill="#10b981" />
  <text x="460" y="24" text-anchor="middle" class="text-muted" font-size="12">Obsidian — Worldbuilding Vault • Trello Vault Sync</text>

  <!-- Left Sidebar (Explorer) -->
  <rect x="0" y="38" width="180" height="442" class="sidebar-bg border" />
  <text x="18" y="68" class="text-muted" font-weight="600" font-size="11">FILE EXPLORER</text>
  <text x="24" y="98" class="text-muted">📁 Projects</text>
  <text x="36" y="124" class="text-muted">📁 Ideas</text>
  <rect x="30" y="136" width="140" height="26" rx="4" fill="#2d2d38" />
  <text x="46" y="153" class="text-body" font-weight="500">📄 Archmage Tower.md</text>
  <text x="36" y="184" class="text-muted">📄 Ancient Ruins.md</text>
  <text x="36" y="210" class="text-muted">📄 Magic Guild.md</text>

  <!-- Center Editor Pane (Note content) -->
  <rect x="180" y="38" width="410" height="442" class="bg border" />
  <!-- Note Header -->
  <text x="210" y="80" class="text-title" font-size="20">Archmage Tower</text>

  <!-- YAML Frontmatter box -->
  <rect x="210" y="98" width="350" height="66" rx="4" fill="#141419" class="border" />
  <text x="222" y="118" fill="#94a3b8" font-family="monospace" font-size="11">---</text>
  <text x="222" y="134" fill="#a78bfa" font-family="monospace" font-size="11">trello_board_card_id:</text>
  <text x="368" y="134" fill="#38bdf8" font-family="monospace" font-size="11">"6a98...;6a98d25d"</text>
  <text x="222" y="150" fill="#a78bfa" font-family="monospace" font-size="11">trello_due:</text>
  <text x="302" y="150" fill="#38bdf8" font-family="monospace" font-size="11">"2026-10-31"</text>
  <text x="222" y="164" fill="#94a3b8" font-family="monospace" font-size="11">---</text>

  <!-- Note Body -->
  <text x="210" y="196" class="text-body">The central spire erected in the Fourth Age.</text>
  <text x="210" y="222" class="text-body">Houses the planetary observatory and the high</text>
  <text x="210" y="244" class="text-body">council archives. Synced in real time with Trello.</text>
  <text x="210" y="280" class="text-title" font-size="15">Architecture</text>
  <text x="210" y="304" class="text-body">- Outer wards enchanted against scrying</text>
  <text x="210" y="326" class="text-body">- Seven levels of subterranean vaults</text>

  <!-- Right Sidebar: Interactive Trello Card View -->
  <rect x="590" y="38" width="330" height="442" class="sidebar-bg border" />

  <!-- Sidebar Tab Header -->
  <rect x="590" y="38" width="330" height="34" fill="#202028" class="border" />
  <text x="610" y="60" class="text-title" font-size="13">💳 Trello Card View</text>
  <circle cx="895" cy="55" r="8" fill="#2d2d38" />
  <text x="895" y="59" text-anchor="middle" class="text-muted" font-size="11">⚙</text>

  <!-- Card View Container inside Sidebar -->
  <g transform="translate(605, 82)">
    <!-- Card Cover Banner -->
    <rect width="300" height="68" rx="6" fill="#3b2d54" />
    <path d="M 0 45 Q 60 20 120 40 T 240 30 T 300 45 L 300 68 L 0 68 Z" fill="#583e7a" opacity="0.6" />
    <text x="14" y="38" fill="#e9d5ff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="14">Tower of High Sorcery</text>

    <!-- Card Info Card -->
    <rect y="74" width="300" height="310" rx="6" class="card-bg border" />

    <!-- Card Title & List -->
    <text x="14" y="98" class="text-title" font-size="14">Archmage Tower</text>
    <text x="14" y="116" class="text-muted">in list <tspan fill="#38bdf8" font-weight="500">Major Landmarks</tspan></text>

    <!-- Badges (Due & Labels) -->
    <rect x="14" y="128" width="92" height="20" rx="4" class="badge-green" />
    <text x="22" y="142" class="badge-text">📅 Oct 31, 2026</text>

    <rect x="112" y="128" width="60" height="20" rx="4" class="badge-purple" />
    <text x="120" y="142" class="badge-text">Lore-Core</text>

    <!-- Checklists Section -->
    <text x="14" y="174" class="text-title" font-size="12">CHECKLIST (2/3)</text>
    <!-- Item 1 (checked) -->
    <rect x="14" y="186" width="14" height="14" class="checkbox-checked" />
    <polyline points="17,193 20,196 25,189" class="check-mark" />
    <text x="36" y="198" class="text-muted" text-decoration="line-through">Floor plan sketches</text>

    <!-- Item 2 (checked) -->
    <rect x="14" y="210" width="14" height="14" class="checkbox-checked" />
    <polyline points="17,217 20,220 25,213" class="check-mark" />
    <text x="36" y="222" class="text-muted" text-decoration="line-through">High council NPC roster</text>

    <!-- Item 3 (unchecked) -->
    <rect x="14" y="234" width="14" height="14" class="checkbox" />
    <text x="36" y="246" class="text-body">Defensive ward mechanics</text>

    <!-- Quick Action / Status -->
    <rect x="14" y="264" width="272" height="1" fill="#383844" />
    <text x="14" y="284" class="text-muted">Activity</text>
    <text x="14" y="304" class="text-body">💬 <tspan fill="#94a3b8">Trois:</tspan> Updated leyline alignment specs.</text>

    <!-- Live indicator -->
    <circle cx="22" cy="344" r="4" fill="#10b981" />
    <text x="32" y="348" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Synced &amp; Editable in real time</text>
  </g>
</svg>
